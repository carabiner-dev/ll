syntax = "proto3";

package carabiner.ll.v1;

option go_package = "github.com/carabiner-dev/ll/api/carabiner/ll/v1;llv1";

import "carabiner/ll/v1/messages.proto";

// LamplightService provides a Google Zanzibar-style permissions API.
service LamplightService {
  // Check determines whether a subject has a permission on an object.
  rpc Check(CheckRequest) returns (CheckResponse);

  // Write creates or touches relation tuples.
  rpc Write(WriteRequest) returns (WriteResponse);

  // Read returns relation tuples matching a filter.
  rpc Read(ReadRequest) returns (ReadResponse);

  // Delete removes relation tuples matching a filter.
  rpc Delete(DeleteRequest) returns (DeleteResponse);

  // ListObjects returns all objects of a given type on which the subject has a permission.
  rpc ListObjects(ListObjectsRequest) returns (ListObjectsResponse);

  // Expand returns the full tree of subjects with a given permission on an object.
  rpc Expand(ExpandRequest) returns (ExpandResponse);

  // WriteSchema writes or updates a named schema set.
  rpc WriteSchema(WriteSchemaRequest) returns (WriteSchemaResponse);

  // ReadSchema returns the authorization schema. If name is specified, returns that
  // specific schema set. Otherwise returns all schema sets concatenated.
  rpc ReadSchema(ReadSchemaRequest) returns (ReadSchemaResponse);

  // ListSchemaSets returns the names of all stored schema sets.
  rpc ListSchemaSets(ListSchemaSetsRequest) returns (ListSchemaSetsResponse);

  // DeleteSchemaSet removes a named schema set.
  rpc DeleteSchemaSet(DeleteSchemaSetRequest) returns (DeleteSchemaSetResponse);

  // HealthCheck returns the health of the service.
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);

  // WhoAmI returns the authenticated user's identity and IAM grants.
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse);

  // EnsurePath ensures all parent tuples exist for a hierarchical path.
  // It parses the path, checks which tuples already exist, and creates only
  // the missing ones. Returns information about what was created vs. existed.
  //
  // Path format: type:id>type:id>type:id#relation
  // Example: folder:root>folder:projects>file:readme.md#parent
  //
  // This creates tuples connecting each child to its parent:
  //   folder:projects#parent@folder:root
  //   file:readme.md#parent@folder:projects
  rpc EnsurePath(EnsurePathRequest) returns (EnsurePathResponse);

  // GrantRole assigns a role to a subject on an object.
  // Roles are defined in the server configuration and expand to a set of tuples.
  // Role-granted tuples cannot be deleted individually; they are removed when
  // the role is revoked.
  rpc GrantRole(GrantRoleRequest) returns (GrantRoleResponse);

  // RevokeRole removes a role assignment from a subject on an object.
  // This deletes all tuples that were created when the role was granted.
  rpc RevokeRole(RevokeRoleRequest) returns (RevokeRoleResponse);

  // ListRoleAssignments returns all role assignments matching the filter.
  rpc ListRoleAssignments(ListRoleAssignmentsRequest) returns (ListRoleAssignmentsResponse);

  // ListRoles returns the names of all defined roles.
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
}
